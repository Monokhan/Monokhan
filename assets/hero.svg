<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Marcelo Reinoso · @Monokhan — Control de gestión, datos, automatización con IA, minería e infraestructura vial">
