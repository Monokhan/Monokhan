    <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#e08a3c" stop-opacity=".22"/><stop offset="1" stop-color="#e08a3c" stop-opacity="0"/></radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#f5b041"/><stop offset=".35" stop-color="#e08a3c"/><stop offset=".65" stop-color="#22d3ee"/><stop offset="1" stop-color="#f5b041"/>
