    </linearGradient>
    <linearGradient id="fadeR" x1="0" x2="1"><stop offset="0" stop-color="#070b14" stop-opacity="0"/><stop offset="1" stop-color="#070b14" stop-opacity=".9"/></linearGradient>
    <linearGradient id="spark" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".2"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
      .role { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; font-size: 28px; font-weight: 600; fill: #e6edf3; opacity: 0; animation: cycle 12s infinite; }
      .r1 { animation-delay: 3s; } .r2 { animation-delay: 6s; } .r3 { animation-delay: 9s; }
      @keyframes cycle { 0% { opacity: 0; transform: translateY(14px); } 4% { opacity: 1; transform: translateY(0); } 21% { opacity: 1; transform: translateY(0); } 25% { opacity: 0; transform: translateY(-14px); } 100% { opacity: 0; } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .spark { stroke-dasharray: 520; stroke-dashoffset: 520; animation: draw 6s ease-in-out infinite; }
      @keyframes draw { 0% { stroke-dashoffset: 520; } 45%, 80% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -520; } }
      .lane { animation: lane 1.2s linear infinite; }
      @keyframes lane { to { stroke-dashoffset: -48; } }
    </style>
  </defs>
